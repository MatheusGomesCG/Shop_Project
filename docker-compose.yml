name: foodcenture

x-java-env: &java-env
  DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-foodcenture}
  DB_USER: ${POSTGRES_USER:-foodcenture}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
  JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  AUTH_URL: http://auth:8081
  CATALOG_URL: http://catalog:8082
  ORDER_URL: http://order:8083
  PAYMENT_URL: http://payment:8084
  DELIVERY_URL: http://delivery:8085

# Healthcheck vem do HEALTHCHECK de infra/java/Dockerfile.
x-java: &java
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
    flyway:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodcenture}
      POSTGRES_USER: ${POSTGRES_USER:-foodcenture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL atende os containers; EXTERNAL atende quem roda o serviço fora do Docker (IDE).
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Tópico só existe se o kafka-init criou: erro de digitação no nome falha alto.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["127.0.0.1:29092:29092"]
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    entrypoint: [/bin/bash, /scripts/create-topics.sh]
    volumes:
      - ./infra/kafka:/scripts:ro
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: foodcenture
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["127.0.0.1:8090:8080"]
    depends_on:
      kafka:
        condition: service_healthy

  flyway:
    image: flyway/flyway:11-alpine
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-foodcenture}
      FLYWAY_USER: ${POSTGRES_USER:-foodcenture}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      FLYWAY_CONNECT_RETRIES: 10
    volumes:
      - ./infra/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    <<: *java
    image: ${IMAGE_PREFIX:-ghcr.io/matheusgomescg/shop_project}/auth:${IMAGE_TAG:-dev}
    build: {context: ., dockerfile: infra/java/Dockerfile, args: {SERVICE: auth}}
    environment: {<<: *java-env, SERVER_PORT: 8081}
    ports: ["127.0.0.1:8081:8081"]

  catalog:
    <<: *java
    image: ${IMAGE_PREFIX:-ghcr.io/matheusgomescg/shop_project}/catalog:${IMAGE_TAG:-dev}
    build: {context: ., dockerfile: infra/java/Dockerfile, args: {SERVICE: catalog}}
    environment: {<<: *java-env, SERVER_PORT: 8082}
    ports: ["127.0.0.1:8082:8082"]

  order:
    <<: *java
    image: ${IMAGE_PREFIX:-ghcr.io/matheusgomescg/shop_project}/order:${IMAGE_TAG:-dev}
    build: {context: ., dockerfile: infra/java/Dockerfile, args: {SERVICE: order}}
    environment: {<<: *java-env, SERVER_PORT: 8083}
    ports: ["127.0.0.1:8083:8083"]

  payment:
    <<: *java
    image: ${IMAGE_PREFIX:-ghcr.io/matheusgomescg/shop_project}/payment:${IMAGE_TAG:-dev}
    build: {context: ., dockerfile: infra/java/Dockerfile, args: {SERVICE: payment}}
    environment: {<<: *java-env, SERVER_PORT: 8084, PAYMENT_GATEWAY_MODE: "${PAYMENT_GATEWAY_MODE:-stub}"}
    ports: ["127.0.0.1:8084:8084"]

  delivery:
    <<: *java
    image: ${IMAGE_PREFIX:-ghcr.io/matheusgomescg/shop_project}/delivery:${IMAGE_TAG:-dev}
    build: {context: ., dockerfile: infra/java/Dockerfile, args: {SERVICE: delivery}}
    environment: {<<: *java-env, SERVER_PORT: 8085, DELIVERY_SIMULATOR_INTERVAL_MS: "${DELIVERY_SIMULATOR_INTERVAL_MS:-5000}"}
    ports: ["127.0.0.1:8085:8085"]

  admin-bff:
    <<: *java
    image: ${IMAGE_PREFIX:-ghcr.io/matheusgomescg/shop_project}/admin-bff:${IMAGE_TAG:-dev}
    build: {context: ., dockerfile: infra/java/Dockerfile, args: {SERVICE: admin-bff}}
    environment: {<<: *java-env, SERVER_PORT: 8080}
    ports: ["127.0.0.1:8080:8080"]

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/matheusgomescg/shop_project}/web:${IMAGE_TAG:-dev}
    build: {context: ., dockerfile: web/Dockerfile}
    ports: ["127.0.0.1:4200:80"]
    depends_on:
      admin-bff:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
