server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bff http://admin-bff:8080;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /actuator/health {
        proxy_pass $bff$request_uri;
    }

    location ~ ^/api/orders/[^/]+/tracking/stream$ {
        proxy_pass $bff$request_uri;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
    }

    location /api/ {
        proxy_pass $bff$request_uri;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /graphql {
        proxy_pass $bff$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
