# Stack do servidor (staging/produção). O CD copia este arquivo para ~/foodcenture no servidor,
# junto com .env (segredos), migrations/ e create-topics.sh. Postgres é externo: vem de DB_URL.
name: foodcenture

x-java: &java
  restart: unless-stopped
  # Permite DB_URL=jdbc:postgresql://host.docker.internal:5432/... quando o Postgres roda no próprio servidor.
  extra_hosts: ["host.docker.internal:host-gateway"]
  environment: &java-env
    DB_URL: ${DB_URL:?}
    DB_USER: ${DB_USER:?}
    DB_PASSWORD: ${DB_PASSWORD:?}
    JWT_SECRET: ${JWT_SECRET:?}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    AUTH_URL: http://auth:8081
    CATALOG_URL: http://catalog:8082
    ORDER_URL: http://order:8083
    PAYMENT_URL: http://payment:8084
    DELIVERY_URL: http://delivery:8085
    PAYMENT_GATEWAY_MODE: ${PAYMENT_GATEWAY_MODE:-stub}

services:
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    entrypoint: [/bin/bash, /scripts/create-topics.sh]
    volumes:
      - ./create-topics.sh:/scripts/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy

  flyway:
    image: flyway/flyway:11-alpine
    command: migrate
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      FLYWAY_URL: ${DB_URL:?}
      FLYWAY_USER: ${DB_USER:?}
      FLYWAY_PASSWORD: ${DB_PASSWORD:?}
      FLYWAY_CONNECT_RETRIES: 5
    volumes:
      - ./migrations:/flyway/sql:ro

  auth:
    <<: *java
    image: ghcr.io/matheusgomescg/shop_project/auth:${IMAGE_TAG:?}
    environment: {<<: *java-env, SERVER_PORT: 8081}

  catalog:
    <<: *java
    image: ghcr.io/matheusgomescg/shop_project/catalog:${IMAGE_TAG:?}
    environment: {<<: *java-env, SERVER_PORT: 8082}

  order:
    <<: *java
    image: ghcr.io/matheusgomescg/shop_project/order:${IMAGE_TAG:?}
    environment: {<<: *java-env, SERVER_PORT: 8083}

  payment:
    <<: *java
    image: ghcr.io/matheusgomescg/shop_project/payment:${IMAGE_TAG:?}
    environment: {<<: *java-env, SERVER_PORT: 8084}

  delivery:
    <<: *java
    image: ghcr.io/matheusgomescg/shop_project/delivery:${IMAGE_TAG:?}
    environment: {<<: *java-env, SERVER_PORT: 8085}

  admin-bff:
    <<: *java
    image: ghcr.io/matheusgomescg/shop_project/admin-bff:${IMAGE_TAG:?}
    environment: {<<: *java-env, SERVER_PORT: 8080}

  web:
    image: ghcr.io/matheusgomescg/shop_project/web:${IMAGE_TAG:?}
    restart: unless-stopped
    # HTTPS fica num proxy na frente (Caddy, Traefik ou o do provedor) apontando para esta porta.
    ports: ["${WEB_PORT:-80}:80"]

volumes:
  kafka-data:
