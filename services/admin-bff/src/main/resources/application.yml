server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: admin-bff
  lifecycle:
    timeout-per-shutdown-phase: 30s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: foodcenture-admin-bff
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        "[isolation.level]": read_committed
    listener:
      ack-mode: manual_immediate
      observation-enabled: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[enable.idempotence]": true
        "[max.in.flight.requests.per.connection]": 5
    template:
      observation-enabled: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
          auth:
            url: ${AUTH_URL:http://localhost:8081}
          catalog:
            url: ${CATALOG_URL:http://localhost:8082}
          order:
            url: ${ORDER_URL:http://localhost:8083}
          payment:
            url: ${PAYMENT_URL:http://localhost:8084}
          delivery:
            url: ${DELIVERY_URL:http://localhost:8085}
  graphql:
    http:
      path: /graphql
    graphiql:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  pattern:
    level: "%5p [${spring.application.name},traceId=%X{traceId:-},spanId=%X{spanId:-}]"
